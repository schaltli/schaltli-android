name: Release APK

# Builds the signed APK and publishes it as a GitHub release, for the phones
# that install it by hand (the designer's handbook, geraete/android.md, sends
# people to this repository's Releases page).
#
# Runs on a tag v<versionName>, e.g. v0.1.0:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The release key lives in this repository's secrets and nowhere in the code:
#   SCHALTLI_KEYSTORE_BASE64    the keystore file, base64-encoded
#   SCHALTLI_KEYSTORE_PASSWORD  its password
#   SCHALTLI_KEY_ALIAS          the key's alias in it
#   SCHALTLI_KEY_PASSWORD       the key's own password
# It is one key for the app's whole life - Android installs an update only
# over an app signed with the same one - so the secrets are not its backup.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No wrapper is committed here; this is the version its properties name.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: The tag names the version the app says it is
        # The phone announces versionName as its firmwareVersion; a release
        # whose tag says otherwise would be two names for one build.
        run: |
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but versionName is $name - bump versionName (and versionCode) first"
            exit 1
          fi

      - name: Unit tests
        run: gradle testDebugUnitTest --console=plain

      - name: Signed release APK
        env:
          SCHALTLI_KEYSTORE_BASE64: ${{ secrets.SCHALTLI_KEYSTORE_BASE64 }}
          SCHALTLI_KEYSTORE_PASSWORD: ${{ secrets.SCHALTLI_KEYSTORE_PASSWORD }}
          SCHALTLI_KEY_ALIAS: ${{ secrets.SCHALTLI_KEY_ALIAS }}
          SCHALTLI_KEY_PASSWORD: ${{ secrets.SCHALTLI_KEY_PASSWORD }}
        run: |
          if [ -z "$SCHALTLI_KEYSTORE_BASE64" ]; then
            echo "::error::the SCHALTLI_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          export SCHALTLI_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$SCHALTLI_KEYSTORE_BASE64" | base64 -d > "$SCHALTLI_KEYSTORE"
          gradle assembleRelease --console=plain
          rm -f "$SCHALTLI_KEYSTORE"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/schaltli-$GITHUB_REF_NAME.apk"

      - name: The APK carries a signature
        run: |
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --print-certs "$RUNNER_TEMP/schaltli-$GITHUB_REF_NAME.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/schaltli-$GITHUB_REF_NAME.apk" \
            --title "Schaltli $GITHUB_REF_NAME" \
            --notes "Die Schaltli-App für Android 8.0 oder neuer. Installieren und einrichten: https://matthias-hess.github.io/schaltli-designer/geraete/android.html"
